name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: Buildozer
        run: pip install --upgrade pip && pip install buildozer "Cython==0.29.37" setuptools

      - name: Кэш SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Сборка
        run: yes | buildozer -v android debug

      - name: Переименовать
        run: mv bin/*.apk bin/Smena.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Smena-apk
          path: bin/Smena.apk

      - name: Обновить релиз «latest» (удобно скачать с телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Смена — последняя сборка
          prerelease: false
          make_latest: true
          files: bin/Smena.apk
